<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>МКОУ Крутишинская СОШ — Расписание</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="header">
    <div class="school-mark" aria-hidden="true">К</div>
    <div>
      <div class="eyebrow">МКОУ КРУТИШИНСКАЯ СОШ</div>
      <h1>Расписание</h1>
    </div>
  </header>

  <section class="card intro">
    <h2>Расписание занятий</h2>
    <p>Выберите класс и день недели. Данные расписания можно будет заполнить позже, когда школа утвердит расписание.</p>
  </section>

  <section class="section">
    <h2 class="section-title">Класс</h2>
    <div id="classList" class="class-grid"></div>
  </section>

  <section id="scheduleSection" class="section hidden">
    <div class="section-heading">
      <h2 class="section-title" id="selectedClassTitle">Расписание</h2>
      <button id="resetButton" class="text-button" type="button">Сменить класс</button>
    </div>
    <div id="dayList" class="day-list"></div>
    <div class="card schedule-card">
      <div class="schedule-date" id="selectedDayTitle"></div>
      <div id="lessons"></div>
    </div>
  </section>

  <section class="section useful">
    <h2 class="section-title">Полезное</h2>
    <a class="menu-link" href="https://krutishkaedu54ru.edusite.ru/" target="_blank" rel="noopener">
      <span>🌐</span><span>Официальный сайт школы</span><span>›</span>
    </a>
  </section>

  <footer class="footer">МКОУ Крутишинская СОШ</footer>
</main>

<script src="https://st.max.ru/js/max-web-app.js"></script>
<script src="app.js"></script>
</body>
</html>
